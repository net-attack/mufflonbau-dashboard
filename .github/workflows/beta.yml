name: Publish weather beta
on:
  push:
    tags:
      - 'v*-beta.*'
permissions:
  contents: read
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a feature branch commit
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/feature/weather-alerts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r test/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run ci
      - name: Publish the tested feature commit as an opt-in HACS prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ github.ref_name }}
        run: |
          [[ "$BETA_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || exit 1
          gh release create "$BETA_TAG" mufflonbau-dashboard.js \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --latest=false --title "Weather beta $BETA_TAG" \
            --notes-file docs/WEATHER-ALERTS.de.md

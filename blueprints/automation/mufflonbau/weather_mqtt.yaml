# Generated by node scripts/weather-mqtt-blueprint.mjs; edit the generator or shared macros.
# Shared macros SHA-256: f586a2ee198f3fe9f9d977be1aa55cf09f95f4291739473f77197f33798b36b7
blueprint:
  name: Mufflonbau · NINA/DWD mit persistenter MQTT-Warnhistorie
  description: >-
    Führt bestehende Warnquellen zusammen. MQTT Discovery und retained JSON ersetzen kein Warnsystem, sondern
    speichern den Dashboard-Aggregatzustand. Vor der ersten Verwendung Discovery registrieren, das
    tatsächliche Sensorziel prüfen und einen nachweislich frischen Zustandsspeicher einmalig initialisieren.
    Fehlende Historie wird niemals automatisch geleert.
  domain: automation
  source_url: https://github.com/net-attack/mufflonbau-dashboard/blob/main/blueprints/automation/mufflonbau/weather_mqtt.yaml
  homeassistant:
    min_version: 2026.10.1
  input:
    nina_entities:
      name: NINA-Warnsensoren für den gewünschten Ort
      default: []
      selector:
        entity:
          filter:
            domain: binary_sensor
            integration: nina
          multiple: true
    dwd_entities:
      name: DWD-Warnsensoren für denselben Ort
      default: []
      selector:
        entity:
          filter:
            domain: sensor
            integration: dwd_weather_warnings
          multiple: true
    aggregate_entity:
      name: Tatsächlich angelegter MQTT-Aggregatsensor
      description: Nach Discovery ermittelte Entity-ID; auch auf ein mögliches _2-Suffix achten.
      selector:
        entity:
          filter:
            domain: sensor
            integration: mqtt
    state_topic:
      name: Retained Zustandstopic
      description: 'Eindeutiges MQTT-Topic für Zustand und Warnhistorie; keine Platzhalter + oder #.'
      selector:
        text: {}
    discovery_topic:
      name: Discovery-Topic
      description: 'Eigenes Discovery-Topic: <prefix>/sensor/<eindeutige_id>/config. Nicht das Zustandstopic.'
      selector:
        text: {}
    birth_topic:
      name: HA-Birth-Topic
      description: Das tatsächlich konfigurierte HA-MQTT-Birth-/Will-Topic mit online/offline.
      default: homeassistant/status
      selector:
        text: {}
    alert_actions:
      name: Aktionen bei neuer wichtiger akustischer Warnung
      description: >-
        Optional, standardmäßig still. NINA ab Stufe 3, DWD ab Stufe 4. Variablen: sound_events, sound_token,
        alert_title, alert_message. Keine Schleife; nur nach bestätigtem MQTT-Commit.
      default: []
      selector:
        action: {}
mode: queued
max: 50
max_exceeded: warning
variables:
  nina_entities: !input nina_entities
  dwd_entities: !input dwd_entities
  aggregate_entity: !input aggregate_entity
  state_topic: !input state_topic
  discovery_topic: !input discovery_topic
  birth_topic: !input birth_topic
triggers:
  - trigger: state
    entity_id: !input nina_entities
    id: nina_update
  - trigger: state
    entity_id: !input dwd_entities
    id: dwd_update
  - trigger: state
    entity_id: !input aggregate_entity
    from:
      - unknown
      - unavailable
    to: null
    id: aggregate_recovery
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: mqtt
    topic: !input birth_topic
    payload: online
    id: mqtt_online
conditions:
  - condition: template
    value_template: >-
      {{ trigger is not defined or trigger is none or trigger.id is not defined or trigger.id !=
      'aggregate_recovery'
            or (trigger.to_state is not none and trigger.to_state.state not in ['unknown', 'unavailable']) }}
actions:
  - alias: Topic-Kollisionen und ungültige Ziele abweisen
    condition: template
    value_template: |-
      {{ state_topic | length > 0 and discovery_topic | length > 0 and birth_topic | length > 0
        and state_topic != discovery_topic and state_topic != birth_topic and discovery_topic != birth_topic
        and '+' not in state_topic ~ discovery_topic ~ birth_topic and '#' not in state_topic ~ discovery_topic ~ birth_topic
        and discovery_topic is match('^[^+#]+/sensor/(?:[A-Za-z0-9_-]+/)?[A-Za-z0-9_-]+/config$')
        and aggregate_entity is match('^sensor[.][a-z0-9_]+$') }}
  - alias: MQTT-Sensor registrieren; vorhandene Historie bleibt unverändert
    action: mqtt.publish
    data:
      topic: '{{ discovery_topic }}'
      payload: |-
        {% set identity = discovery_topic | sha256 %}
        {{ dict(name='Mufflonbau Weather Alerts', unique_id='mufflonbau_weather_' ~ identity,
          default_entity_id=aggregate_entity, state_topic=state_topic, json_attributes_topic=state_topic,
          value_template='{{ value_json.count }}', qos=1, icon='mdi:weather-cloudy-alert',
          device=dict(identifiers=['mufflonbau_weather_' ~ identity], name='Mufflonbau Wetter',
            manufacturer='Mufflonbau', model='NINA/DWD warning aggregate')) | to_json }}
      qos: 1
      retain: true
  - alias: Retained Historie wiederherstellen; bei Zeitüberschreitung ohne Veröffentlichung oder Ton stoppen
    wait_template: |-
      {{ has_value(aggregate_entity)
        and state_attr(aggregate_entity, 'transport') == 'mufflonbau-weather-mqtt-v1'
        and state_attr(aggregate_entity, 'state_topic') == state_topic
        and state_attr(aggregate_entity, 'ledger') is mapping
        and state_attr(aggregate_entity, 'commit_id') is string }}
    timeout:
      seconds: 45
    continue_on_timeout: false
  - variables:
      details: {}
      active_nina: '{{ nina_entities | select(''is_state'', ''on'') | list }}'
  - if: '{{ active_nina | count > 0 }}'
    then:
      - action: nina.get_details
        target:
          entity_id: '{{ active_nina }}'
        response_variable: details
        continue_on_error: true
  - alias: Historie nach NINA-Abfrage erneut prüfen
    condition: template
    value_template: |-
      {{ has_value(aggregate_entity)
        and state_attr(aggregate_entity, 'transport') == 'mufflonbau-weather-mqtt-v1'
        and state_attr(aggregate_entity, 'state_topic') == state_topic
        and state_attr(aggregate_entity, 'ledger') is mapping
        and state_attr(aggregate_entity, 'commit_id') is string }}
  - variables:
      next_payload: |
        {# Copy to /config/custom_templates/mufflonbau_weather_alerts.jinja. #}
        {% macro normalize(nina_entities, dwd_entities, details, stamp, returns) %}
          {% set ns = namespace(warnings=[], problems=[]) %}
          {% for id in nina_entities %}
            {% if not has_value(id) %}
              {% set ns.problems = ns.problems + ['NINA: ' ~ id ~ ' nicht verfügbar'] %}
            {% elif is_state(id, 'on') %}
              {% set d = details.get(id) or {} %}
              {% if not d %}
                {% set ns.problems = ns.problems + ['NINA: Details fehlen für ' ~ id] %}
              {% else %}
                {% set severity = d.get('severity', 'Unknown') | lower %}
                {% set level = dict(minor=1, moderate=2, severe=3, extreme=4).get(severity, 1) %}
                {% set end = d.get('expires') or '' %}
                {% set start = d.get('start') or d.get('sent') or '' %}
                {% set area = d.get('affected_areas') or '' %}
                {% set title = d.get('headline') or 'NINA Warnung' %}
                {% set identity = d.get('id') or ([title, start, area] | join('|')) %}
                {% if not end or as_timestamp(end, stamp + 1) > stamp %}
                  {% set ns.warnings = ns.warnings + [dict(id='NINA:' ~ identity, source='NINA', title=title,
                    type=d.get('category') or d.get('event') or '', severity=severity, level=level, area=area,
                    start=start, end=end, description=(d.get('description') or '') | striptags,
                    instruction=(d.get('recommended_actions') or '') | striptags)] %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% for id in dwd_entities %}
            {% if not has_value(id) %}
              {% set ns.problems = ns.problems + ['DWD: ' ~ id ~ ' nicht verfügbar'] %}
            {% else %}
              {% set attrs = states[id].attributes %}
              {% for i in range(1, (attrs.get('warning_count', 0) | int(0)) + 1) %}
                {% set prefix = 'warning_' ~ i ~ '_' %}
                {% set level = attrs.get(prefix ~ 'level', 0) | int(0) %}
                {% set title = attrs.get(prefix ~ 'headline') or attrs.get(prefix ~ 'name') or 'DWD Warnung' %}
                {% set start = attrs.get(prefix ~ 'start') | string %}
                {% set end = attrs.get(prefix ~ 'end') | string %}
                {% set area = attrs.get('region_name') or '' %}
                {# Warning index, advance/current bucket and update timestamp are NOT identity. #}
                {% set identity = ['DWD', attrs.get('region_id', area), attrs.get(prefix ~ 'type', title), start] | join('|') %}
                {% if level in [1, 2, 3, 4] and as_timestamp(end, stamp + 1) > stamp %}
                  {% set ns.warnings = ns.warnings + [dict(id=identity, source='DWD', title=title,
                    type=attrs.get(prefix ~ 'name') or '', severity='Stufe ' ~ level, level=level,
                    area=area, start=start, end=end, description=(attrs.get(prefix ~ 'description') or '') | striptags,
                    instruction=(attrs.get(prefix ~ 'instruction') or '') | striptags)] %}
                {% endif %}
              {% endfor %}
            {% endif %}
          {% endfor %}
          {% do returns(dict(warnings=ns.warnings | sort(attribute='level', reverse=true) | unique(attribute='id') | list, problems=ns.problems)) %}
        {% endmacro %}

        {% macro advance(warnings, previous, stamp, returns) %}
          {% set ns = namespace(ledger={}, popup=[], sound=[]) %}
          {% for key, record in previous.items() %}
            {# Keep cleared/outage warnings for a week after their last known expiry. #}
            {% if record.get('retain_until', 0) | float(0) > stamp %}
              {% set ns.ledger = dict(ns.ledger, **{key: record}) %}
            {% endif %}
          {% endfor %}
          {% for w in warnings %}
            {% set old = ns.ledger.get(w.id, {}).get('level', 0) | int(0) %}
            {% set level = w.level | int(0) %}
            {% if level > old and level >= 3 %}
              {% set ns.popup = ns.popup + [w] %}
              {% if w.source == 'NINA' or level >= 4 %}{% set ns.sound = ns.sound + [w] %}{% endif %}
            {% endif %}
            {% set expiry = as_timestamp(w.end, stamp) %}
            {% set ns.ledger = dict(ns.ledger, **{w.id: dict(level=[old, level] | max, retain_until=[expiry, stamp] | max + 604800)}) %}
          {% endfor %}
          {% do returns(dict(ledger=ns.ledger, popup=ns.popup, sound=ns.sound)) %}
        {% endmacro %}
        {% set stamp = as_timestamp(now()) %}
        {% set snapshot = (normalize | as_function)(nina_entities, dwd_entities, details, stamp) %}
        {# Read retained history INSIDE the queued action, after restoration and details retrieval. #}
        {% set previous = states[aggregate_entity].attributes %}
        {% set result = (advance | as_function)(snapshot.warnings, previous.ledger, stamp) %}
        {% set commit = now().isoformat() ~ '-' ~ (range(0, 100000) | random) %}
        {{ dict(transport='mufflonbau-weather-mqtt-v1', state_topic=state_topic,
          commit_id=commit, updated_at=now().isoformat(), count=snapshot.warnings | count,
          warnings=snapshot.warnings,
          problems=snapshot.problems if nina_entities + dwd_entities else ['Keine Warnquellen konfiguriert'],
          ledger=result.ledger,
          popup_token=(result.popup | map(attribute='id') | join('|') ~ ':' ~ commit) if result.popup else previous.get('popup_token', ''),
          sound_token=(result.sound | map(attribute='id') | join('|') ~ ':' ~ commit) if result.sound else previous.get('sound_token', ''),
          sound_events=result.sound) }}
  - alias: Warnungen und Dedup-Historie gemeinsam retained speichern
    action: mqtt.publish
    data:
      topic: '{{ state_topic }}'
      payload: '{{ next_payload | to_json }}'
      qos: 1
      retain: true
  - alias: Exakten Commit abwarten, bevor Ton oder nächste Warteschlangenaktion möglich ist
    wait_template: |-
      {{ has_value(aggregate_entity)
                and state_attr(aggregate_entity, 'commit_id') == next_payload.commit_id
                and state_attr(aggregate_entity, 'ledger') == next_payload.ledger }}
    timeout:
      seconds: 30
    continue_on_timeout: false
  - variables:
      sound_events: '{{ next_payload.sound_events }}'
      sound_token: '{{ next_payload.sound_token }}'
      alert_title: '{{ (next_payload.sound_events[0].source ~ '' · Warnung'') if next_payload.sound_events else '''' }}'
      alert_message: '{{ next_payload.sound_events | map(attribute=''title'') | join('' · '') }}'
  - if: '{{ sound_events | count > 0 }}'
    then: !input alert_actions
